# fly.toml app configuration file generated for vtessera-sandbox on 2026-10-11T01:44:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vtessera-sandbox'
primary_region = 'syd'

[build]
  dockerfile = 'Containerfile'

[env]
  VTESSERA_ADDR = ':8080'
  VTESSERA_DB = '/data/vtessera.db'
  VTESSERA_SIGNER_KEY = '/data/signer.key'

[[mounts]]
  source = 'vtessera_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
