# Weekly-long devnet soak (MAINNET-CHECKLIST §6).
#
# Runs the soak runner (`crates/devnet-demo/src/bin/soak.rs`) hourly
# against Solana devnet and fails the run on any unexpected error. The
# goal: one week of continuous green before mainnet.
#
# Notes:
# - Scheduled workflows only run on the default branch (`main`), so this
#   takes effect once merged. Use `workflow_dispatch` to run it manually.
# - The payer keypair is a dedicated throwaway devnet key (in the
#   `DEVNET_PAYER_KEYPAIR` secret). The devnet `init_config` pins that
#   key as settlement authority (config PDA seed `vtessera_config_v2`),
#   so the soak's finalize is fully self-signed. No operator key is used
#   here.
# - The payer is topped up with a devnet airdrop when its balance drops
#   below 2 SOL (airdrops are rate-limited; the run proceeds regardless).

name: devnet-soak

on:
  schedule:
    - cron: '0 * * * *'   # hourly
  workflow_dispatch:
    inputs:
      iters:
        description: 'Iterations per run'
        required: false
        default: '100'
      cancel_p:
        description: 'Cancel probability [0-1]'
        required: false
        default: '0.2'
      parallel:
        description: 'Concurrent jobs in flight (2-3 recommended)'
        required: false
        default: '3'

concurrency:
  group: devnet-soak
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache solana CLI
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: solana-cli-3.1.14-x86_64-linux

      - name: Install solana CLI
        run: |
          set -euo pipefail
          # release.solana.com is unreachable from GitHub Actions runners
          # (persistent SSL_ERROR_SYSCALL), so fetch the release tarball
          # straight from the anza-xyz/agave GitHub release instead.
          if [ -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            "$HOME/.local/share/solana/install/active_release/bin/solana" --version
            exit 0
          fi
          # Checksum is the integrity gate (same pinned digest as ci.yml).
          EXPECTED=06f97c065cc977cbec2f13ffc9bc9d3b92fef485431fcb370a269de69532ef51
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
            -o /tmp/solana-release.tar.bz2 \
            https://github.com/anza-xyz/agave/releases/download/v3.1.14/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo "$EXPECTED  /tmp/solana-release.tar.bz2" | sha256sum -c -
          mkdir -p "$HOME/.local/share/solana/install/active_release"
          tar -xjf /tmp/solana-release.tar.bz2 \
            -C "$HOME/.local/share/solana/install/active_release" --strip-components=1
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/solana/install/active_release/bin/solana" --version

      - name: Write payer keypair from secret
        env:
          DEVNET_PAYER_KEYPAIR: ${{ secrets.DEVNET_PAYER_KEYPAIR }}
        run: |
          test -n "$DEVNET_PAYER_KEYPAIR" || {
            echo "::error::set the DEVNET_PAYER_KEYPAIR repository secret (devnet deploy key id.json)"
            exit 1
          }
          mkdir -p "$HOME/.config/solana"
          printf '%s' "$DEVNET_PAYER_KEYPAIR" > "$HOME/.config/solana/id.json"
          chmod 600 "$HOME/.config/solana/id.json"

      - name: Fund payer if low
        run: |
          solana config set --url devnet --keypair "$HOME/.config/solana/id.json" >/dev/null
          BAL=$(solana balance | awk '{print $1}')
          echo "payer balance: $BAL SOL"
          LOW=$(python3 -c "import sys; print(1 if float('$BAL') < 2.0 else 0)")
          if [ "$LOW" = "1" ]; then
            solana airdrop 2 --url devnet || echo "airdrop rate-limited; continuing with existing balance"
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            crates/devnet-demo/target
          key: soak-${{ hashFiles('crates/devnet-demo/Cargo.lock') }}

      - name: Build soak runner
        working-directory: crates/devnet-demo
        run: cargo build --release --locked --bin soak

      - name: Run soak
        working-directory: crates/devnet-demo
        run: |
          ITERS="${{ github.event.inputs.iters || '100' }}"
          CANCEL_P="${{ github.event.inputs.cancel_p || '0.2' }}"
          PARALLEL="${{ github.event.inputs.parallel || '3' }}"
          ./target/release/soak --iters "$ITERS" --cancel-p "$CANCEL_P" --parallel "$PARALLEL" 2>&1 | tee soak.log

      - name: Upload soak log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-log
          path: crates/devnet-demo/soak.log
          retention-days: 14
