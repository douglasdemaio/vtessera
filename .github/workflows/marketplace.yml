# Marketplace: decentralized node registry
#
# Nodes POST their signed offer here via repository_dispatch.
# The workflow validates the signature, appends to nodes.json,
# and commits. GitHub Pages serves the result.
#
# To register, a node sends:
#   POST https://api.github.com/repos/<owner>/<repo>/dispatches
#   Authorization: Bearer <GITHUB_TOKEN>
#   Event: node-register
#   Body: { "client_payload": { "offer": { ... }, "sig_hex": "..." } }

name: Marketplace

on:
  repository_dispatch:
    types: [node-register, node-deregister]
  schedule:
    # Prune stale entries every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialize update runs so concurrent `node-register` dispatches (and the
# node's hourly retries) don't race reading/writing marketplace/nodes.json.
concurrency:
  group: marketplace-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Handle node registration
        if: github.event_name == 'repository_dispatch' && github.event.action == 'node-register'
        run: |
          PAYLOAD='${{ toJSON(github.event.client_payload) }}'
          OFFER=$(echo "$PAYLOAD" | jq -r '.offer')
          SIG=$(echo "$PAYLOAD" | jq -r '.sig_hex')
          NODE_ID=$(echo "$OFFER" | jq -r '.body.node_id')
          ENDPOINT=$(echo "$OFFER" | jq -r '.body.endpoint')

          echo "Registering node: $NODE_ID at $ENDPOINT"

          # Reject malformed/invalid registrations (missing node_id or no offer
          # body). This prevents garbage payloads from being persisted.
          if [ -z "$NODE_ID" ] || [ "$NODE_ID" = "null" ] || ! echo "$OFFER" | jq -e '.body != null' >/dev/null 2>&1; then
            echo "Ignoring invalid registration (missing node_id or offer body)"
            exit 0
          fi

          # iroh dial-by-EndpointId support: persist the candidates + endpoint_id
          # the node registered alongside its offer so marketplace entries are
          # dialable over iroh QUIC (nodes.json resolver, §7d). Optional — older
          # nodes register without them.
          ENDPOINT_ID=$(echo "$PAYLOAD" | jq -c '.endpoint_id? // empty')
          [ -z "$ENDPOINT_ID" ] && ENDPOINT_ID=null
          CANDIDATES=$(echo "$PAYLOAD" | jq -c '.candidates? // empty')
          [ -z "$CANDIDATES" ] && CANDIDATES=null

          ENTRY=$(printf '%s' "$OFFER" | jq -c \
            --arg id "$NODE_ID" --arg sig "$SIG" --argjson ts "$(date +%s)" \
            --argjson eid "$ENDPOINT_ID" --argjson cands "$CANDIDATES" '
            { node_id: $id,
              offer: .,
              sig_hex: $sig,
              updated_at: $ts,
              endpoint: .body.endpoint,
              endpoint_id: ($eid // .body.endpoint_id),
              candidates: $cands }
            | if $cands == null then del(.candidates) else . end
          ')
          [ -n "$ENTRY" ] || { echo "Failed to build entry for $NODE_ID"; exit 1; }

          # Read existing nodes
          NODES=$(cat marketplace/nodes.json)

          # Check if node already exists, update or append
          EXISTS=$(echo "$NODES" | jq --arg id "$NODE_ID" '.nodes | map(select(.node_id == $id)) | length')

          if [ "$EXISTS" -gt 0 ]; then
            # Update existing node
            NODES=$(echo "$NODES" | jq --arg id "$NODE_ID" --argjson entry "$ENTRY" '
              .nodes |= map(if .node_id == $id then $entry else . end)
            ')
          else
            # Append new node
            NODES=$(echo "$NODES" | jq --argjson entry "$ENTRY" '
              .nodes += [$entry]
            ')
          fi

          # Update timestamp and write
          NODES=$(echo "$NODES" | jq --argjson ts "$(date +%s)" '.updated_at = $ts')
          echo "$NODES" | jq . > marketplace/nodes.json

          echo "Registered $NODE_ID (${#NODES} nodes total)"

      - name: Handle node deregistration
        if: github.event_name == 'repository_dispatch' && github.event.action == 'node-deregister'
        run: |
          PAYLOAD='${{ toJSON(github.event.client_payload) }}'
          NODE_ID=$(echo "$PAYLOAD" | jq -r '.node_id')

          echo "Deregistering node: $NODE_ID"

          NODES=$(cat marketplace/nodes.json)
          NODES=$(echo "$NODES" | jq --arg id "$NODE_ID" '
            .nodes |= map(select(.node_id != $id)) |
            .updated_at = '"$(date +%s)"'
          ')
          echo "$NODES" | jq . > marketplace/nodes.json

          echo "Deregistered $NODE_ID"

      - name: Prune stale entries
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          NOW=$(date +%s)
          STALE_THRESHOLD=21600  # 6 hours — prune on the same cadence as the schedule

          NODES=$(cat marketplace/nodes.json)
          BEFORE=$(echo "$NODES" | jq '.nodes | length')

          NODES=$(echo "$NODES" | jq --argjson now "$NOW" --argjson threshold "$STALE_THRESHOLD" '
            .nodes |= map(select(($now - .updated_at) < $threshold)) |
            .updated_at = $now
          ')

          AFTER=$(echo "$NODES" | jq '.nodes | length')
          echo "$NODES" | jq . > marketplace/nodes.json

          REMOVED=$((BEFORE - AFTER))
          echo "Pruned $REMOVED stale entries ($BEFORE → $AFTER)"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketplace/nodes.json
          git diff --staged --quiet || git commit -m "marketplace: update nodes.json [skip ci]"
          git push

  deploy-pages:
    runs-on: ubuntu-latest
    needs: update
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: marketplace
      - id: deployment
        uses: actions/deploy-pages@v4
