name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # cc-rs looks for x86_64-linux-musl-gcc by default; musl-tools ships musl-gcc.
  CC_x86_64_unknown_linux_musl: musl-gcc
  AR_x86_64_unknown_linux_musl: ar

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl

      - name: Install musl cross-compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Format check
        run: cargo fmt --check

      # vtesserad (v0) — the audited metering daemon. Its dep budget is
      # enforced via Cargo.toml (BUILD.md §1.3); CI gates the surface.
      - name: Clippy vtesserad (default features)
        run: cargo clippy -p vtesserad --all-targets -- -D warnings

      - name: Clippy vtesserad (submit feature)
        run: cargo clippy -p vtesserad --all-targets --features submit -- -D warnings

      - name: Test vtesserad (default features)
        run: cargo test -p vtesserad --locked

      - name: Test vtesserad (submit feature)
        run: cargo test -p vtesserad --locked --features submit

      # Module crates (ROADMAP.md §1–§3). Each ships behind its own
      # clippy + test stanza so a regression in (e.g.) the offer crate
      # doesn't masquerade as a vtesserad failure in CI logs.
      - name: Clippy module crates
        run: |
          cargo clippy -p vtessera-executor --all-targets -- -D warnings
          cargo clippy -p vtessera-offer --all-targets -- -D warnings
          cargo clippy -p vtessera-node-api --all-targets -- -D warnings
          cargo clippy -p vtessera-node-api --features serve --all-targets -- -D warnings
          cargo clippy -p vtessera-mini-http --all-targets -- -D warnings
          cargo clippy -p vtessera-offer-index --all-targets -- -D warnings
          cargo clippy -p vtessera-offer-index --features serve --all-targets -- -D warnings
          cargo clippy -p vtessera-settlement --all-targets -- -D warnings

      - name: Test module crates
        run: |
          cargo test -p vtessera-executor --locked
          cargo test -p vtessera-offer --locked
          cargo test -p vtessera-node-api --locked
          cargo test -p vtessera-node-api --features serve --locked
          cargo test -p vtessera-mini-http --locked
          cargo test -p vtessera-offer-index --locked
          cargo test -p vtessera-offer-index --features serve --locked
          cargo test -p vtessera-settlement --locked

      # Anchor escrow program (Module 4) lives under programs/ and builds
      # with the Solana BPF toolchain — `anchor build`. It's excluded
      # from the host workspace, so the host CI doesn't try to compile
      # it; this job hosts the Anchor toolchain.

      # Adversarial escrow suite (MAINNET-CHECKLIST §2): standalone
      # litesvm crate in tests/adversarial. Needs the compiled program
      # ELF first (`anchor build` in programs/), which needs the SBF
      # toolchain. Pinned versions mirror the dev environment.
      #
      # release.solana.com has been intermittently failing TLS handshakes
      # (curl error 35) from CI runners and from dev machines; the agave
      # GitHub release is the same toolchain and is reachable. Download
      # the tarball from the mirror, verify it against the pinned sha256,
      # and put its bin/ on PATH. curl's own retries ride out transient
      # GitHub hiccups; the checksum is the integrity gate.
      - name: Install Solana (Agave) toolchain
        run: |
          set -euo pipefail
          TAG=v3.1.14
          EXPECTED=06f97c065cc977cbec2f13ffc9bc9d3b92fef485431fcb370a269de69532ef51
          TARBALL=solana-release-x86_64-unknown-linux-gnu.tar.bz2
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
            -o "$TARBALL" \
            "https://github.com/anza-xyz/agave/releases/download/$TAG/$TARBALL"
          echo "$EXPECTED  $TARBALL" | sha256sum -c -
          mkdir -p solana-release
          tar -xjf "$TARBALL" -C solana-release
          RELEASE_DIR="$RUNNER_TEMP/solana-release/solana-release"
          echo "$RELEASE_DIR/bin" >> "$GITHUB_PATH"
          export PATH="$RELEASE_DIR/bin:$PATH"
          cargo-build-sbf --version

      # Anchor CLI is a thin `cargo install` wrapper itself (avm just runs
      # `cargo install --git ... anchor-cli`), so install anchor-cli 0.30.1
      # directly. This avoids compiling avm, whose dependency tree pulls an
      # old openssl-sys that fails against Ubuntu 24.04's OpenSSL 3 headers.
      # Build with rustc 1.79: anchor 0.30.1's locked time 0.3.29 only
      # compiles with the parsing/formatting/macros features on rustc <= 1.79
      # (E0282 type annotations needed for Box<_> on 1.80+).
      - name: Install Anchor CLI
        run: |
          rustup toolchain install 1.79.0 --profile minimal
          cargo +1.79.0 install --locked anchor-cli --git https://github.com/coral-xyz/anchor --tag v0.30.1
          anchor --version

      - name: Build escrow program (BPF)
        run: |
          cd programs
          anchor build
          sha256sum target/deploy/vtessera_escrow.so

      - name: Program unit tests (drift guard for error codes)
        run: |
          cd programs/vtessera-escrow
          cargo fmt --check
          cargo test --locked

      - name: Adversarial suite (litesvm, §2)
        run: |
          cd tests/adversarial
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - name: Build vtesserad (static musl, default features)
        run: cargo build -p vtesserad --release --locked --target x86_64-unknown-linux-musl

      - name: Build vtesserad (static musl, submit feature)
        run: cargo build -p vtesserad --release --locked --features submit --target x86_64-unknown-linux-musl

      - name: systemd-analyze security (best-effort)
        run: |
          sudo apt-get update && sudo apt-get install -y systemd
          systemd-analyze security --no-pager packaging/vtesserad.service || true

      - name: Stage binary artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/vtesserad dist/
        if: github.ref == 'refs/heads/main'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vtesserad-x86_64-unknown-linux-musl
          path: dist/vtesserad
        if: github.ref == 'refs/heads/main'
