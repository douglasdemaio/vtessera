# Fly.io configuration for vtessera-mcp, the MCP server.
#
# This is a different kind of service from the marketplace next door, and the
# differences below are all consequences of that one fact: it holds no key, writes
# nothing, and every tool is a read of the marketplace's public HTTP API. So
# there is no volume, no signing key to lose, no database to back up, and nothing
# here that must not restart. A machine that dies is a machine that can be
# replaced without asking anyone.
#
# It is a separate app rather than a second process on the marketplace machine
# because it is a separate module with its own dependency graph and its own
# release cadence, and because an MCP endpoint should not be able to take the
# marketplace down with it.
#
# Deploy scope: this file covers the MCP app only. The marketplace and
# agent-ai-tool.com stay pull-request-only; a deploy token for this app must not
# be read as permission for either of them.
#
# Four properties the hosted version has to keep, none of which this file can
# enforce but all of which the image is built to satisfy:
#   - an agent's private key never reaches this process: it has no key material
#     and no place to keep any, and it only ever reads the marketplace's public
#     HTTP API;
#   - read tools work with no credentials, because those endpoints are public;
#   - a caller's bearer token, if a write tool ever accepts one, is used for
#     that request alone and never stored. Today no tool reads one at all -
#     the set is entirely read-only - so this holds trivially. Adding a write
#     tool would need the server switched to the SDK's Stateless mode to keep
#     it, because in the default sessionful mode a tool handler is bound to the
#     token that sent `initialize` rather than to the caller's current request.
#     That is a design decision, not an implementation detail; do not assume it.
#   - no tool touches a spending cap. The whole tool set is read-only, and the
#     package documentation for mcp/internal/mcpserver says so as a contract.

app = "vtessera-mcp"

# Same region as the marketplace so a tool call is not a cross-ocean round trip.
primary_region = "fra"

[build]
  # flyctl builds the same Containerfile the local `make mcp-image` does, so what
  # ships is what was tested. That Containerfile builds from mcp/, because mcp/ is
  # its own module and the repo root is a different dependency graph.
  dockerfile = "mcp/Containerfile"

[env]
  # Not secrets. There is nothing to keep here: the server holds no key and signs
  # nothing, and its only configuration is which marketplace to read from.
  VTESSERA_BASE_URL = "https://vtessera.fly.dev"
  VTESSERA_MCP_ADDR = ":8080"
  VTESSERA_TIMEOUT = "15s"

[http_service]
  internal_port = 8080
  force_https = true

  # Smallest machine and idle auto-stop, because this server serves almost
  # nobody. shared-cpu-1x/256MB is the smallest size Fly offers at all - its
  # pricing page lists tiers 256/512MB/1GB/2GB and calls 256MB the "Smallest
  # Machine size" - so there is no smaller number available to choose here.
  #
  # Auto-stop is where the saving is: Fly bills by the second while running and
  # is explicit that auto-stopped machines cost less. For a tool called
  # occasionally rather than continuously that is the difference between paying
  # for 30 days of a machine and paying for its actual calls.
  #
  # The cost is a cold start. It is a cheap one: no database to load and no key
  # to read, because this server has neither.
  auto_stop_machines = true
  auto_start_machines = true
  # Zero, because a non-zero floor with auto-stop on would keep one machine warm
  # and make auto-stop decorative.
  min_machines_running = 0

  # Deliberately no [[http_service.checks]]. The endpoint is /mcp, which is
  # POST-only: an MCP initialize is not a thing a health prober can send without
  # speaking MCP, and a GET returns 405 rather than a health verdict. The server
  # has no /healthz on purpose, because a second endpoint reporting a different
  # notion of health than the marketplace does is one more thing that can disagree
  # with the truth. Verify a deploy by calling a tool.
  #
  # [[http_service.checks]]
  #   interval = "30s"
  #   timeout = "5s"
  #   method = "GET"
  #   path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"