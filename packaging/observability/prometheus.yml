global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vtessera-node
    static_configs:
      - targets: ["host.containers.internal:8400"]
    metrics_path: /metrics

  - job_name: vtessera-offer-index
    static_configs:
      - targets: ["host.containers.internal:8403"]
    metrics_path: /metrics
