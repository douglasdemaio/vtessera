[package]
name = "vtessera-adversarial"
description = "Vtessera Module 4 — litesvm adversarial test suite for the escrow program (MAINNET-CHECKLIST §2)"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# Standalone on purpose: this crate pins the agave/solana 4.x tree (via
# LiteSVM 0.15, which tracks the current mainnet-beta floor — Agave 4.1)
# while the escrow program builds on solana-sdk 1.18. The 1.18 tree pins
# subtle = 2.4.1 exactly (solana-frozen-abi) and the 4.x tree needs
# subtle >= 2.6, so the two cannot share a Cargo.lock. This crate is
# excluded from the host workspace (/home/douglas/vtessera/Cargo.toml)
# and builds on its own; `cargo test` here loads
# programs/target/deploy/vtessera_escrow.so and exercises it with litesvm.
#
# VERSION POLICY: every dependency is pinned EXACTLY to the version
# LiteSVM 0.15.2 itself locks (see LiteSVM/litesvm v0.15.2 Cargo.lock) and
# Cargo.lock is committed. The solana/agave crates are released in
# lockstep and their caret ranges drift (e.g. solana-account 4.6.0 needs
# wincode 0.6 while LiteSVM uses wincode 0.5), so anything looser than an
# exact pin silently re-breaks the build. CI runs `cargo test --locked`.
# If you bump LiteSVM, re-pin every crate below from the new release's
# Cargo.lock.
[workspace]

[dependencies]
litesvm = "=0.15.2"
sha2 = "=0.10.9"
solana-account = "=4.3.1"
solana-address = "=2.6.1"
solana-hash = "=4.5.0"
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-sdk-ids = "=3.1.0"
solana-signer = "=3.0.1"
solana-system-interface = "=3.2.0"
solana-transaction = "=4.1.5"
solana-transaction-error = "=3.3.1"
