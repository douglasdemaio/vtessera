[package]
name = "vtessera-escrow"
description = "Vtessera Module 4 — non-custodial escrow, direct stablecoin settlement + SOL fee (Anchor program)"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/douglasdemaio/vtessera"

# This crate is intentionally EXCLUDED from the host Cargo workspace
# (see /home/douglas/vtessera/Cargo.toml) and instead is a member of
# the Anchor workspace at /home/douglas/vtessera/programs/Cargo.toml.
# Anchor / cargo-build-sbf is the only toolchain that should compile it.

[lib]
crate-type = ["cdylib", "lib"]
name = "vtessera_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
# Version pin lands when the toolchain is actually wired. Anchor 0.30 is
# the current stable line at time of writing; the program is small enough
# to track new majors without churn.
anchor-lang = "0.30"
anchor-spl = "0.30"

[dev-dependencies]
# Adversarial test suite (MAINNET-CHECKLIST §2) lives in a SEPARATE
# standalone crate at /home/douglas/vtessera/tests/adversarial with its
# own Cargo.lock. The program's 1.18 tree pins subtle = 2.4.1 exactly
# (via solana-frozen-abi) while LiteSVM's solana-sdk 2.1 tree requires
# subtle >= 2.6 (CtOption::into_option in solana-curve25519); the two
# cannot share a lockfile. The adversarial crate loads the compiled
# `vtessera_escrow.so` (built by cargo-build-sbf here) and encodes all
# instructions/accounts by hand, so it has no crate dependency on us.
