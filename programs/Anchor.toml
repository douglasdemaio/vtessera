# Anchor 0.30 defaults program discovery to `<anchor-root>/programs/*`;
# this Anchor.toml lives at the anchor root (programs/), so list the
# member explicitly or `anchor build` silently finds nothing.
[workspace]
members = ["vtessera-escrow"]

[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
vtessera_escrow = "8UJy6B2ZX3swc6XLgGzWeEfcrP7ujZyBcFrKfp5YkA47"

[programs.devnet]
vtessera_escrow = "8UJy6B2ZX3swc6XLgGzWeEfcrP7ujZyBcFrKfp5YkA47"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
