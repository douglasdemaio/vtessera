[package]
name = "vtessera-node-api"
description = "Vtessera Module 2 — node HTTP surface (x402 + MCP), pure dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vtessera_node_api"
path = "src/lib.rs"

# The HTTP-server binaries are gated behind the `serve` feature. The
# default (library-only) build opens no sockets — that's what node-api
# ships in tests and what other crates link against.
[[bin]]
name = "vtessera-node"
path = "src/bin/vtessera_node.rs"
required-features = ["serve"]

[[bin]]
name = "vtessera-mcp"
path = "src/bin/vtessera_mcp.rs"
required-features = ["serve"]

[features]
default = []
# `serve` wires the agent-facing binaries. It pulls the executor in so the
# node/MCP binaries can run jobs — the library itself stays socket-free and
# executor-free by default (v0's no-inbound-network rule survives). It also
# pulls settlement so the node signs per-job metering receipts (Module 3).
serve = [
    "dep:vtessera-mini-http",
    "dep:vtessera-executor",
    "dep:vtessera-settlement",
    "dep:vtessera-transport",
    "dep:ureq",
    # Production CPU backend (ROADMAP.md §1): Cloud Hypervisor microVM. The
    # feature only pulls serde_json in the executor crate; it spawns the
    # `cloud-hypervisor` binary at runtime.
    "vtessera-executor/cloud-hypervisor",
    # GPU passthrough via VFIO (ROADMAP.md §1c). Enables the vtessera-gpu
    # helper binary and GPU admission path in the CH executor.
    "vtessera-executor/gpu",
]
# Kata Containers on Cloud Hypervisor (ROADMAP.md §1a). Adds the kata backend
# to the node/MCP binaries behind a feature gate.
kata = ["vtessera-executor/kata"]

[dependencies]
# Pure dispatch only. No socket layer here — that lives in a thin binary
# crate gated behind a Cargo feature so v0's no-inbound-network rule
# survives by default. See ROADMAP.md §2c.
vtessera-offer = { path = "../offer" }
# Module 1 (ROADMAP.md §1). Feature-gated so the default library build
# never links the privileged executor surface; only the `serve` binaries
# (the composition roots) construct a backend.
vtessera-executor = { path = "../executor", optional = true }
# Module 3 (ROADMAP.md §3): job-receipt signing for the node binary.
vtessera-settlement = { path = "../settlement", optional = true }
vtessera-mini-http = { path = "../mini-http", optional = true }
vtessera-transport = { path = "../transport", optional = true }
# Outbound HTTP for the offer-index publish loop + claim gate + MCP discover
# (serve only — the default library build stays socket-free).
ureq = { workspace = true, optional = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Test-only: build a deterministic SigningKey to construct test offers.
# Production callers receive a SignedOffer they didn't have to sign.
ed25519-dalek = { workspace = true }
