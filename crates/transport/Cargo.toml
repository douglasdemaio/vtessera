[package]
name = "vtessera-transport"
description = "Vtessera transport layer — pluggable connectivity for internet-scale discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vtessera_transport"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rand_core = { version = "0.6", optional = true }
tokio = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[features]
default = []
serve = ["dep:ureq", "dep:iroh", "dep:rand", "dep:rand_core", "dep:tokio", "dep:base64", "dep:hex"]

[[example]]
name = "iroh_client"
required-features = ["serve"]

[dev-dependencies]
# Test-only: cross-check the iroh EndpointId against the same Ed25519
# public key that signs offers (design P1.4, test 6a-5).
ed25519-dalek = { workspace = true }
