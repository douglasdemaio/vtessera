[package]
name = "vtessera-devnet-demo"
description = "End-to-end devnet demonstration of the Vtessera escrow flow"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/douglasdemaio/vtessera"

# Off-chain demo binary, EXCLUDED from the host Cargo workspace
# (see /home/douglas/vtessera/Cargo.toml). Pinning solana-sdk 1.18.x
# drags in an older crypto dep tree (curve25519-dalek 3 / zeroize 1.5)
# that conflicts with the host crates' ed25519-dalek 2 ecosystem;
# carrying a separate Cargo.lock here is cheaper than down-rev'ing the
# host workspace.
[[bin]]
name = "vtessera-devnet-demo"
path = "src/main.rs"

# MAINNET-CHECKLIST §6.1 — varied-parameter devnet soak runner.
[[bin]]
name = "soak"
path = "src/bin/soak.rs"

[dependencies]
# Solana SDK on the 3.x line (Agave) — modern crypto tree that clears the
# RUSTSEC advisories the 1.18 line pulled in (solana-ed25519-program 3.x no
# longer pins ed25519-dalek 1.0.1). 4.x is not reachable yet because the
# spl-token/spl-ata crates max out on the solana-3.x line. Off-chain dev
# tools only; the on-chain program stays on 1.18 (reproducible-build gate)
# and is reached by address.
solana-client = "=3.1.14"
solana-sdk = "=3.0.0"
# Solana 3.x split out several modules into separate crates that the source
# still imports directly. Declared explicitly so the `use` paths resolve.
solana-commitment-config = "3.1.1"
solana-system-interface = "2.0.0"
# spl-token 9.x moved the token `state` and `instruction` builders into the
# shared `spl-token-interface` crate; spl-token 9.0.0 re-exports `id()` only.
spl-token-interface = "2.0.0"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }

# Anchor uses borsh 0.10 for IX serialisation on the 0.30 line.
borsh = "0.10"
sha2 = "0.10"
ctrlc = "3"

# NOTE: the demo does NOT depend on vtessera-executor or vtessera-settlement
# even though it exercises their semantics. Those crates pull modern crypto
# (ed25519-dalek 2 → zeroize 1.5) that conflicts with solana-sdk 1.18's
# curve25519-dalek 3 → zeroize 1.3. The bits the demo needs (a noop CPU
# executor returning synthetic metering, and `f = clamp(used / agreed, 0, 1)`)
# are inlined below. The host crates remain the authoritative implementations
# everything else in the workspace depends on.
