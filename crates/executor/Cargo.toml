[package]
name = "vtessera-executor"
description = "Vtessera Module 1 — job execution + accelerator passthrough"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vtessera_executor"
path = "src/lib.rs"

[[bin]]
name = "vtessera-gpu"
path = "src/bin/vtessera_gpu.rs"
required-features = ["gpu"]

[[test]]
name = "ch_cpu_integration"
path = "tests/ch_cpu_integration.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "ch_gpu_integration"
path = "tests/ch_gpu_integration.rs"
required-features = ["cloud-hypervisor"]

[features]
default = []
# Production CPU backend: Cloud Hypervisor microVM (ROADMAP.md §1). Spawns the
# `cloud-hypervisor` binary — no Rust-side VMM bindings — so the feature adds
# only serde_json for the manifest/metering JSON. The default build stays
# dep-light (serde + hex) so CI and the v0 daemon never link this surface.
cloud-hypervisor = ["dep:serde_json"]
# GPU passthrough via VFIO (ROADMAP.md §1c). Extends the CH backend with
# --device host=... for whole-GPU passthrough. Adds the vtessera-gpu helper
# binary for PCI bind/unbind lifecycle.
gpu = ["cloud-hypervisor"]
# Kata Containers on Cloud Hypervisor (ROADMAP.md §1a). Production isolation
# via containerd + kata-shimv2. Pulls gRPC deps for containerd communication.
# Depends on cloud-hypervisor for shared GPU selection and network policy functions.
kata = ["cloud-hypervisor", "dep:tonic", "dep:prost", "dep:tokio", "dep:tower", "dep:hyper-util"]

[dependencies]
# Pinned via the workspace. The executor crate's threat model is documented in
# ROADMAP.md §1; production backends (Kata + Cloud Hypervisor + VFIO + DCGM)
# add their own deps behind cargo features as they land.
serde = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true, optional = true }
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
# Async shim the sync Kata Executor bridges through (containerd is gRPC/async
# underneath). `kata`-gated: the default build never links tokio.
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "io-util"], optional = true }
# UDS connector (tower::service_fn) for tonic → containerd.sock.
tower = { version = "0.4", features = ["util"], optional = true }
# TokioIo adapter: tonic's connector wants hyper::rt streams, the socket is a
# tokio stream. hyper's readapt from one io trait to the other.
hyper-util = { version = "0.1", optional = true }
