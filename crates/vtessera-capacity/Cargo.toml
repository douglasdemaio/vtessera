[package]
name = "vtessera-capacity"
description = "Vtessera capacity controller — shared capacity.toml schema + file-drop apply (no sockets, no GPU, no money)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vtessera-capacity"
path = "src/bin/vtessera_capacity.rs"

[dependencies]
# Schema-first (issue #109): the node reads and the controller writes the
# *same* capacity.toml schema, so a file dropped by the controller is
# exactly what the node's parser validates. This crate is deliberately
# dependency-light — no sockets, no executor, no payment surface.
serde = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }

[features]
# Usage-based autoscale engine (issue #109 v2): pulls the node's `/metrics`
# demand gauges and re-writes `capacity.toml`. The only socket this crate
# ever opens is an *outbound* client poll, so it stays off by default and
# the base crate keeps its "no sockets" property.
default = []
autoscale = ["dep:ureq"]

[dependencies.ureq]
workspace = true
optional = true