[package]
name = "vtessera-agent"
version = "0.1.0"
edition = "2018"
description = "CLI entry point for AI agents to discover and submit jobs to vtessera nodes"
license = "Apache-2.0"
repository = "https://github.com/douglasdemaio/vtessera"

[[bin]]
name = "vtessera-agent"
path = "src/main.rs"

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# P1.7e: queue rendezvous. When the resolved target is a coordinator queue
# (outbound-only node), the agent enqueues over iroh QUIC instead of a
# blocking HTTP POST; the node pulls the job itself.
vtessera-coordinator = { path = "../coordinator", features = ["serve"] }
iroh = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
hex = { workspace = true }
