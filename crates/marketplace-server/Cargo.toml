[package]
name = "marketplace-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reference marketplace server for internal vtessera deployments"

[[bin]]
name = "marketplace-server"
path = "src/main.rs"

[dependencies]
vtessera-metrics = { path = "../vtessera-metrics" }
axum = "0.7"
tower-http = { version = "0.5", features = ["limit"] }
tokio = { version = "1", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
